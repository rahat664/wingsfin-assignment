services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wingfin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 4000
      TZ: ${MARKET_TIMEZONE}
      MARKET_OPEN_TIME: ${MARKET_OPEN_TIME}
      MARKET_CLOSE_TIME: ${MARKET_CLOSE_TIME}
      MARKET_TIMEZONE: ${MARKET_TIMEZONE}
      DEFAULT_INDEX_SYMBOL: ${DEFAULT_INDEX_SYMBOL}
      DEFAULT_STOCK_SYMBOL: ${DEFAULT_STOCK_SYMBOL}
      MARKET_SIMULATOR_ENABLED: ${MARKET_SIMULATOR_ENABLED}
      SIMULATOR_MAX_INTERVAL_MS: ${SIMULATOR_MAX_INTERVAL_MS}
      INDEX_YESTERDAY_CLOSE: ${INDEX_YESTERDAY_CLOSE}
      STOCK_YESTERDAY_CLOSE: ${STOCK_YESTERDAY_CLOSE}
    ports:
      - "${BACKEND_PORT}:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT}
        VITE_SOCKET_URL: http://localhost:${BACKEND_PORT}
        VITE_MARKET_OPEN_TIME: ${MARKET_OPEN_TIME}
        VITE_MARKET_CLOSE_TIME: ${MARKET_CLOSE_TIME}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  wingfin_postgres_data:
